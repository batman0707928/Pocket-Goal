<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060B1A">
<meta name="description" content="Pocket-Goal: Small savings. Bigger goals.">
<title>Pocket-Goal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23060B1A'/%3E%3Ccircle cx='256' cy='256' r='160' fill='none' stroke='%232F6BFF' stroke-width='28'/%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M199 186H261A52 52 0 0 1 261 290H235V326H199Z M235 218V258H259A20 20 0 0 0 259 218Z'/%3E%3C/svg%3E">
<style>
:root{--bg:#060B1A;--s:#0D1530;--s2:#131D40;--ink:#E8EEFF;--mute:#8A97BD;--line:#1E2A55;--blue:#2F6BFF;--cyan:#22D3EE;--ok:#34D399;--warn:#FBBF24;--bad:#F87171;color-scheme:dark}
[data-theme=light]{--bg:#F3F6FD;--s:#fff;--s2:#EEF2FC;--ink:#0B1330;--mute:#5A6690;--line:#DCE3F5;--blue:#2457E6;--cyan:#0891B2;--ok:#059669;--warn:#B45309;--bad:#DC2626;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;overflow-x:hidden}
main{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 24px;max-width:1000px;margin:0 auto}
aside,.br{display:none}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:4px 0 14px}
h2{font-size:15px;font-weight:600;margin-bottom:12px}
.sub{color:var(--mute);font-size:13px}
.mh,.br{align-items:center;gap:10px;font-weight:700}.mh{display:flex}
.mh svg,.br svg{width:32px;height:32px}
.card{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#1A3FA8,#0E2A6E 55%,#0A1B4A);border:0;color:#fff}
.hero .sub{color:#B9C8FF}
.big{font-size:38px;font-weight:700;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat span{display:block;color:var(--mute);font-size:12px}.stat b{font-size:19px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.t{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.bar{height:10px;border-radius:6px;background:var(--s2);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--cyan));transform-origin:left;animation:gw 1s cubic-bezier(.2,.8,.2,1) both}
.bar i.ok{background:var(--ok)}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.cat{margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.r{text-align:right}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--blue);color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.96)}.btn.alt{background:var(--s2);color:var(--ink)}.btn.sm{padding:7px 12px;font-size:13px}
label.btn{display:inline-block;font-size:15px;color:var(--ink)}
.lk{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;font-size:13px;padding:2px 6px}
input,select{font:inherit;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.fl{display:grid;gap:8px}.ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.em{text-align:center;padding:30px 12px;color:var(--mute)}.em b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}.em .btn{margin-top:14px}
.ch{width:100%;height:auto;display:block}.gb{transform-box:fill-box;transform-origin:bottom;animation:gb .8s both}
.lg{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}.lg i,.lgv i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.dv{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.dn{width:140px;height:140px;flex:none}.lgv div{font-size:13px;margin:3px 0}
.nb{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;padding:10px 2px;border-radius:10px;cursor:pointer}.nb.on{color:#fff;background:var(--blue)}
#bnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--s);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;z-index:11;box-shadow:0 6px 20px rgba(47,107,255,.5)}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}#sh.open{display:flex}
#fm2{background:var(--s);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:90vh;overflow:auto;animation:sl .35s cubic-bezier(.2,.8,.2,1)}
#ts{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;background:var(--s2);border:1px solid var(--blue);padding:10px 16px;border-radius:12px;z-index:60;transition:.3s;pointer-events:none;max-width:90vw}
#ts.on{opacity:1;transform:translate(-50%,0)}#ts.bad{border-color:var(--bad)}
#view>*{animation:ri .5s both}#view>*:nth-child(n+3){animation-delay:.06s}
#sp{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 35%,#10245F,#060B1A 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;transition:opacity .5s;cursor:pointer}
#sp.out{opacity:0;pointer-events:none}.sl{width:120px;height:120px;animation:pop .9s cubic-bezier(.2,.8,.2,1) both}
#sp h1{margin:10px 0 0;font-size:30px;animation:ri .8s .4s both}#sp p{color:#9FB4FF;animation:ri .8s .6s both}
.ld{width:200px;height:4px;background:#16224D;border-radius:2px;overflow:hidden;margin-top:18px}.ld i{display:block;height:100%;background:linear-gradient(90deg,#2F6BFF,#22D3EE);transform-origin:left;animation:gw 1.7s .2s ease-in-out both}
@keyframes gw{from{transform:scaleX(0)}}@keyframes gb{from{transform:scaleY(0)}}@keyframes ri{from{opacity:0;transform:translateY(16px)}}@keyframes pop{from{opacity:0;transform:scale(.5) rotate(-30deg)}}@keyframes sl{from{transform:translateY(40px);opacity:0}}
@media(min-width:600px){.fl{grid-template-columns:2fr 1fr 1fr}#sh{align-items:center}#fm2{border-radius:20px}}
@media(min-width:900px){body{padding:0 0 0 230px}aside{display:flex;flex-direction:column;gap:6px;position:fixed;inset:0 auto 0 0;width:230px;background:var(--s);border-right:1px solid var(--line);padding:22px 14px}aside .nb{flex:none;font-size:15px;text-align:left;padding:11px 14px}.br{display:flex;font-size:18px;margin-bottom:18px}.mh,#bnav{display:none}.fab{bottom:24px;right:24px}.grid{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#2F6BFF"/></linearGradient><symbol id="pgl" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0A1230"/><circle cx="256" cy="256" r="196" fill="none" stroke="#2F6BFF" stroke-opacity=".5" stroke-width="5" stroke-dasharray="3 14" stroke-linecap="round"/><circle cx="256" cy="256" r="160" fill="none" stroke="#16224D" stroke-width="18"/><circle cx="256" cy="256" r="160" fill="none" stroke="url(#g1)" stroke-width="18" stroke-linecap="round" stroke-dasharray="720 1006" transform="rotate(-90 256 256)"/><path fill="#fff" fill-rule="evenodd" d="M199 186H261A52 52 0 0 1 261 290H235V326H199Z M235 218V258H259A20 20 0 0 0 259 218Z"/><circle cx="100" cy="291" r="16" fill="#22D3EE"/></symbol></defs></svg>
<div id="sp"><svg class="sl" viewBox="0 0 512 512" role="img" aria-label="Pocket-Goal logo"><use href="#pgl"/></svg><h1>Pocket-Goal</h1><p>Small savings. Bigger goals.</p><div class="ld"><i></i></div></div>
<aside id="side"></aside>
<main id="view"></main>
<nav id="bnav"></nav>
<button class="btn fab" data-a="ntx" id="fab" aria-label="Add transaction">+</button>
<div id="sh"><form id="fm2"></form></div>
<div id="ts" role="status"></div>
<script>
var $=function(i){return document.getElementById(i)},K='pocketgoal.v2',
CATS=['Food','Shopping','Travel','Education','Entertainment','Bills','Transport','Health','Other'],IC=['Salary','Business','Gift','Other'],
COL=['#2F6BFF','#22D3EE','#34D399','#FBBF24','#F87171','#A78BFA','#F472B6','#60A5FA','#94A3B8'],
D={tx:[],goals:[],budget:{total:0,cats:{}},theme:'dark'},tab='dash',F={q:'',cat:'',m:''},
NAV=[['dash','Home'],['tx','Activity'],['goals','Goals'],['bud','Budget'],['an','Insights'],['set','Data']],
TT={dash:'Dashboard',tx:'Transactions',goals:'Savings goals',bud:'Budget',an:'Analytics',set:'Data & settings'};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return (n<0?'\u2212':'')+'$'+(Math.round(Math.abs(n)*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function vd(d){return /^\d{4}-\d\d-\d\d$/.test(d)&&!isNaN(new Date(d+'T00:00'))}
function fd(d){return new Date(d+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function num(v){v=+v;return isFinite(v)&&v>0?Math.round(v*100)/100:0}
function toast(m,bad){var t=$('ts');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=''},2400)}
function fix(x){x=x||{};var d=function(s){return vd(s)?s:today()};
 var t=(Array.isArray(x.tx)?x.tx:[]).map(function(t){return{id:String(t.id||uid()),type:t.type==='income'?'income':'expense',amt:num(t.amt),cat:String(t.cat||'Other').slice(0,30),note:String(t.note||'').slice(0,60),date:d(t.date)}}).filter(function(t){return t.amt>0});
 var g=(Array.isArray(x.goals)?x.goals:[]).map(function(g){return{id:String(g.id||uid()),name:String(g.name||'Goal').slice(0,40),target:num(g.target)||1,date:vd(g.date)?g.date:'',contribs:(Array.isArray(g.contribs)?g.contribs:[]).map(function(c){return{amt:num(c.amt),date:d(c.date)}}).filter(function(c){return c.amt>0})}});
 var b=x.budget||{},bc={};Object.keys(b.cats||{}).forEach(function(k){if(num(b.cats[k])>0)bc[String(k).slice(0,30)]=num(b.cats[k])});
 return{tx:t,goals:g,budget:{total:num(b.total),cats:bc},theme:x.theme==='light'?'light':'dark'}}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('Could not save: storage is full or blocked',1)}}
try{var raw=localStorage.getItem(K);if(raw)D=fix(JSON.parse(raw));else{var o=localStorage.getItem('pocketgoal.v1');if(o){var v=JSON.parse(o);D=fix({tx:(v.tx||[]).map(function(t){var s=new Date(t.date);return{id:t.id,type:t.type,amt:t.amt,cat:t.cat,note:t.note,date:isNaN(s)?today():s.toISOString().slice(0,10)}}),goals:(v.goals||[]).map(function(g){return{id:g.id,name:g.name,target:g.target,contribs:g.saved?[{amt:g.saved,date:today()}]:[]}})});save()}}}catch(e){D=fix({})}
document.documentElement.dataset.theme=D.theme;

function sum(a,ty){return Math.round(a.filter(function(t){return t.type===ty}).reduce(function(s,t){return s+t.amt},0)*100)/100}
function cm(){return today().slice(0,7)}
function inM(m){return D.tx.filter(function(t){return t.date.slice(0,7)===m})}
function mo(n){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function ml(m){return new Date(m+'-01T00:00').toLocaleDateString(undefined,{month:'short'})}
function gs(g){return g.contribs.reduce(function(s,c){return s+c.amt},0)}
function spentBy(m){var o={};inM(m).filter(function(t){return t.type==='expense'}).forEach(function(t){o[t.cat]=(o[t.cat]||0)+t.amt});return o}
function tot(o){return Object.keys(o).reduce(function(s,k){return s+o[k]},0)}
function pbar(v,l,txt){var p=l?v/l:0,c=p>1?'bad':p>=.8?'warn':'ok';return '<div class="t"><span>'+txt+'</span><b class="'+c+'">'+Math.round(p*100)+'%</b></div><div class="bar"><i class="'+c+'" style="width:'+Math.min(p*100,100)+'%"></i></div>'+(p>1?'<div class="sub bad">Over budget by '+money(v-l)+'</div>':p>=.8?'<div class="sub warn">Approaching limit, '+money(l-v)+' left</div>':'')}
function em(t,s,b,a){return '<div class="card em"><b>'+t+'</b>'+s+'<br><button class="btn" data-a="'+a+'">'+b+'</button></div>'}
function field(l,n,a){return '<label>'+l+'<input name="'+n+'" '+a+'></label>'}

function bars(){var ms=[5,4,3,2,1,0].map(mo),d=ms.map(function(m){return[sum(inM(m),'income'),sum(inM(m),'expense')]}),mx=Math.max.apply(null,[1].concat(d[0].concat(d[1],d[2],d[3],d[4],d[5]))),h='<svg viewBox="0 0 320 145" class="ch" role="img" aria-label="Income versus expenses, last 6 months"><line x1="6" x2="314" y1="110" y2="110" stroke="var(--line)"/>';
 d.forEach(function(v,i){var x=10+i*52;[[v[0],'var(--blue)',0],[v[1],'var(--cyan)',16]].forEach(function(p){var bh=p[0]/mx*100;h+='<rect class="gb" x="'+(x+p[2])+'" y="'+(110-bh)+'" width="14" height="'+bh+'" rx="3" fill="'+p[1]+'"/>'});h+='<text x="'+(x+15)+'" y="130" text-anchor="middle" font-size="10" fill="var(--mute)">'+ml(ms[i])+'</text>'});
 return h+'</svg><div class="lg"><i style="background:var(--blue)"></i>Income <i style="background:var(--cyan)"></i>Expenses</div>'}
function line(){var ms=[5,4,3,2,1,0].map(mo),v=ms.map(function(m){return sum(inM(m),'income')-sum(inM(m),'expense')}),mx=Math.max.apply(null,[1].concat(v.map(Math.abs))),p=v.map(function(y,i){return[20+i*56,Math.round((65-y/mx*50)*10)/10]});
 return '<svg viewBox="0 0 320 130" class="ch" role="img" aria-label="Savings trend"><line x1="6" x2="314" y1="65" y2="65" stroke="var(--line)"/><polyline points="'+p.map(function(q){return q.join(',')}).join(' ')+'" fill="none" stroke="var(--ok)" stroke-width="3" stroke-linejoin="round"/>'+p.map(function(q,i){return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="4" fill="var(--ok)"/><text x="'+q[0]+'" y="124" text-anchor="middle" font-size="10" fill="var(--mute)">'+ml(ms[i])+'</text>'}).join('')+'</svg>'}
function donut(o){var k=Object.keys(o),t=tot(o),c=2*Math.PI*50,off=0,h='<svg viewBox="0 0 140 140" class="dn" role="img" aria-label="Spending by category"><g transform="rotate(-90 70 70)">';
 k.forEach(function(n,i){var l=o[n]/t*c;h+='<circle cx="70" cy="70" r="50" fill="none" stroke="'+COL[i%9]+'" stroke-width="22" stroke-dasharray="'+l+' '+(c-l)+'" stroke-dashoffset="'+(-off)+'"/>';off+=l});
 return h+'</g></svg><div class="lgv">'+k.map(function(n,i){return '<div><i style="background:'+COL[i%9]+'"></i>'+esc(n)+' <b>'+money(o[n])+'</b></div>'}).join('')+'</div>'}

function txRow(t,ed){var inc=t.type==='income';return '<div class="row"><div><div>'+esc(t.note||t.cat)+'</div><div class="sub">'+esc(t.cat)+' · '+fd(t.date)+'</div></div><div class="r"><b class="'+(inc?'ok':'bad')+'">'+(inc?'+':'\u2212')+money(t.amt)+'</b>'+(ed?'<div><button class="lk" data-a="etx" data-id="'+t.id+'">Edit</button><button class="lk" data-a="dtx" data-id="'+t.id+'">Delete</button></div>':'')+'</div></div>'}
function vDash(){var m=cm(),t=inM(m),inc=sum(t,'income'),ex=sum(t,'expense'),bal=sum(D.tx,'income')-sum(D.tx,'expense'),bt=D.budget.total,
 h='<div class="card hero"><div class="sub">Total balance</div><div class="big">'+money(bal)+'</div><div class="sub">All income minus all expenses</div></div><div class="grid"><div class="stat"><span>Income this month</span><b class="ok">'+money(inc)+'</b></div><div class="stat"><span>Expenses this month</span><b class="bad">'+money(ex)+'</b></div><div class="stat"><span>Saved this month</span><b>'+money(inc-ex)+'</b></div><div class="stat"><span>Total in goals</span><b>'+money(D.goals.reduce(function(s,g){return s+gs(g)},0))+'</b></div></div>';
 h+='<div class="card"><h2>Monthly budget</h2>'+(bt?pbar(ex,bt,'Spent '+money(ex)+' of '+money(bt)):'<p class="sub">No monthly limit yet.</p><div class="ac"><button class="btn alt sm" data-a="eb">Set a budget</button></div>')+'</div><div class="card"><h2>Income vs expenses</h2>'+bars()+'</div>';
 var rc=D.tx.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).slice(0,5);
 h+='<div class="card"><h2>Recent transactions</h2>'+(rc.length?rc.map(function(t){return txRow(t)}).join('')+'<div class="ac"><button class="btn alt sm" data-a="go" data-id="tx">View all</button></div>':'<p class="sub">Nothing yet. Tap + to add your first entry.</p>')+'</div>';
 return h+'<div class="card"><h2>Savings goals</h2>'+(D.goals.length?D.goals.slice(0,3).map(function(g){var p=Math.min(gs(g)/g.target,1);return '<div class="t"><span>'+esc(g.name)+'</span><b>'+Math.round(p*100)+'%</b></div><div class="bar"><i style="width:'+p*100+'%"></i></div>'}).join(''):'<p class="sub">No goals yet.</p><div class="ac"><button class="btn alt sm" data-a="ng">Create a goal</button></div>')+'</div>'}
function vTx(){var cs=CATS.concat(IC).filter(function(c,i,a){return a.indexOf(c)===i});return '<div class="card"><div class="fl"><input id="q" type="search" placeholder="Search transactions" aria-label="Search" value="'+esc(F.q)+'"><select id="fc" aria-label="Category"><option value="">All categories</option>'+cs.map(function(c){return '<option'+(F.cat===c?' selected':'')+'>'+c+'</option>'}).join('')+'</select><input id="fm" type="month" aria-label="Month" value="'+F.m+'"></div></div><div id="txl"></div>'}
function txl(){var e=$('txl');if(!e)return;var q=F.q.toLowerCase(),l=D.tx.filter(function(t){return(!q||(t.note+' '+t.cat).toLowerCase().indexOf(q)>-1)&&(!F.cat||t.cat===F.cat)&&(!F.m||t.date.slice(0,7)===F.m)}).sort(function(a,b){return b.date.localeCompare(a.date)});
 if(!D.tx.length){e.innerHTML=em('No transactions yet','Add your first income or expense.','Add transaction','ntx');return}
 if(!l.length){e.innerHTML='<div class="card em"><b>No matches</b>Try a different search or filter.</div>';return}
 e.innerHTML='<div class="grid" style="grid-template-columns:1fr 1fr"><div class="stat"><span>Income</span><b class="ok">'+money(sum(l,'income'))+'</b></div><div class="stat"><span>Expenses</span><b class="bad">'+money(sum(l,'expense'))+'</b></div></div><div class="card">'+l.map(function(t){return txRow(t,1)}).join('')+'</div>'}
function vGoals(){if(!D.goals.length)return em('No goals yet','Create a goal and start contributing.','New goal','ng');
 return D.goals.map(function(g){var s=gs(g),p=Math.min(s/g.target,1),dl=g.date?Math.ceil((new Date(g.date+'T00:00')-new Date())/864e5):null;
