.hero{background:radial-gradient(circle at 88% 10%,rgba(0,229,255,.25),transparent 50%),linear-gradient(160deg,#04202E,#020B14);border-radius:6px;color:#D6F6FF}
.hero>.coin{display:none}
.hero:after{background:linear-gradient(110deg,transparent,rgba(0,229,255,.25),transparent)}
.hero .ring circle:first-child{stroke:rgba(0,229,255,.15)}
.hero .ring circle:last-child{stroke:#00E5FF}
.hero .sub{color:#6FA3B8}
.tick{position:absolute;inset:-7px;border-radius:50%;border:2px dashed rgba(0,229,255,.5);animation:spin2 18s linear infinite}
.big{font-family:Orbitron,sans-serif;font-weight:500;font-size:28px;letter-spacing:.02em;color:#fff;text-shadow:0 0 14px rgba(0,229,255,.55)}
.ring .c{font-family:Orbitron,sans-serif;font-size:24px;color:#fff}
.ring .c small{color:#6FA3B8;font-family:Rajdhani,sans-serif;text-transform:uppercase;letter-spacing:.1em}
.stat{background:rgba(5,22,36,.78);border:1px solid var(--line);border-radius:4px;box-shadow:none}
.stat b{font-family:Orbitron,sans-serif;font-size:16px}
.in{color:#3DFFB5}.out{color:#FF5C6C}
.bar{border-radius:0;height:8px;background:repeating-linear-gradient(90deg,#0B2A3B 0 6px,#061821 6px 8px)}
.bar i,.goal .bar i:after{border-radius:0}
.bar i{background:linear-gradient(90deg,#0090B0,#00E5FF)}
.cat .bar i{background:linear-gradient(90deg,#B3263A,#FF5C6C)}
.goal.done .bar i{background:linear-gradient(90deg,#FF9F1C,#FFD166)}
.btn{border-radius:4px;background:transparent;border:1px solid #00E5FF;color:#00E5FF;font-family:Orbitron,sans-serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;box-shadow:inset 0 0 12px rgba(0,229,255,.15)}
.btn.alt{border-color:var(--line);color:var(--ink)}
.btn.sm{font-size:10px}
.rip{background:rgba(0,229,255,.4)}
.fab{background:#00E5FF;color:#001018;border:0;border-radius:50%;box-shadow:0 0 22px rgba(0,229,255,.6)}
.fab:after{border-color:rgba(0,229,255,.8)}
nav{border-radius:6px;background:rgba(3,14,24,.94);box-shadow:0 0 22px rgba(0,229,255,.18)}
#pill{border-radius:4px;background:rgba(0,229,255,.16);border:1px solid #00E5FF;box-shadow:0 0 14px rgba(0,229,255,.35)}
nav button{border-radius:4px;font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
nav button.on{background:none;color:#00E5FF}
.sheet form{background:#04121C;border:1px solid var(--line);border-radius:8px 8px 0 0}
input,select{background:#020B14;border:1px solid var(--line);border-radius:4px}
.seg button{border-radius:4px;font-family:Orbitron,sans-serif;font-size:11px;text-transform:uppercase}
.seg button.on{background:rgba(0,229,255,.2);color:#00E5FF;border-color:#00E5FF}
.toast{background:#04121C;color:#00E5FF;border:1px solid #00E5FF;border-radius:4px;font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.08em}
#splash{background:radial-gradient(circle at 50% 40%,#04202E,#01060B 70%)}
.reactor{width:150px;height:150px;animation:boot 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes boot{from{opacity:0;transform:scale(.3) rotate(-90deg)}}
.reactor:before{content:"";position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.35),transparent 65%)}
.reactor .r{position:absolute;inset:0;border-radius:50%;border:2px solid #00E5FF}
.reactor .r1{border:3px dashed rgba(0,229,255,.85);animation:spin2 10s linear infinite}
.reactor .r2b{inset:14px;border:2px solid transparent;border-top-color:#00E5FF;border-bottom-color:#00E5FF;animation:spin2 3s linear infinite reverse}
.reactor .r3{inset:30px;border:1px solid rgba(0,229,255,.7);box-shadow:inset 0 0 16px rgba(0,229,255,.5)}
.reactor .core{position:absolute;inset:52px;border-radius:50%;background:radial-gradient(circle,#fff,#00E5FF 60%,transparent 72%);animation:corep 1.6s ease-in-out infinite alternate}
@keyframes corep{from{transform:scale(.85);opacity:.7}to{transform:scale(1.15);opacity:1}}
.word{font:700 clamp(26px,8vw,40px)/1.1 Orbitron,sans-serif;letter-spacing:.16em;text-transform:uppercase;margin-top:22px}
.word span{color:#E6FBFF;text-shadow:0 0 14px rgba(0,229,255,.8)}
.tag{font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:.3em;color:#00E5FF}
.lt{border-radius:0;height:6px;background:repeating-linear-gradient(90deg,#0B2A3B 0 6px,#061821 6px 8px)}
.lt i{border-radius:0;background:#00E5FF}
.lm{font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6FA3B8}
.lm b{color:#00E5FF}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.word span,.tag,.load{opacity:1!important}}

<body>
<header><div><h1><span class="logo"></span>Pocket Goal</h1><div class="sub" style="margin-top:4px">All systems online</div></div><div><button class="link" id="reset">Reset</button><button class="link" id="theme" aria-label="Toggle theme">Theme</button></div></header>
<main id="view"></main>
<button class="btn fab" id="fab" aria-label="Add">+</button>
<nav id="nav"><i id="pill"></i><button data-t="home" class="on">Overview</button><button data-t="act">Activity</button><button data-t="goals">Goals</button></nav>
<div class="sheet" id="sheet"><form id="form"></form></div>
<div class="toast" id="toast"></div>
<div id="splash"><div class="orb"></div><div class="coinw reactor"><i class="r r1"></i><i class="r r2b"></i><i class="r r3"></i><i class="core"></i></div><div class="word" id="word" aria-label="Pocket Goal"></div><p class="tag">FINANCIAL INTELLIGENCE SYSTEM</p><div class="load"><div class="lt"><i id="lf"></i></div><div class="lm"><span id="lmsg">Counting coins</span><b id="lpc">0%</b></div></div></div>
<script>
var KEY='pocketgoal.v1', S={tx:[],goals:[]}, tab='home', mode='expense';
var CATS=['Food','Transport','Bills','Fun','Shopping','Health','Other'];
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
if(!S||!Array.isArray(S.tx)||!Array.isArray(S.goals))S={tx:[],goals:[]};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1800)}
function monthTx(){var d=new Date(),k=d.getFullYear()+'-'+d.getMonth();return S.tx.filter(function(t){var x=new Date(t.date);return x.getFullYear()+'-'+x.getMonth()===k})}
function sum(a,ty){return a.filter(function(t){return t.type===ty}).reduce(function(s,t){return s+t.amt},0)}

function ring(p){var r=56,c=2*Math.PI*r;return '<i class="tick"></i><svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="14"/><circle cx="66" cy="66" r="'+r+'" fill="none" stroke="var(--green)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p))+'" style="transition:stroke-dashoffset .8s"/></svg>'}

function home(){
  var m=monthTx(),inc=sum(m,'income'),exp=sum(m,'expense');
  var tg=S.goals.reduce(function(s,g){return s+g.target},0),sv=S.goals.reduce(function(s,g){return s+g.saved},0);
  var p=tg?Math.min(sv/tg,1):0;
  var h='<div class="card hero"><i class="coin c1"></i><i class="coin c2"></i><i class="coin c3"></i><div class="ring">'+ring(p)+'<div class="c">'+Math.round(p*100)+'%<small>of goals</small></div></div><div><div class="sub">Saved toward goals</div><div class="big" data-v="'+sv+'">'+money(sv)+'</div><div class="sub">'+(tg?'of '+money(tg):'No goals yet')+'</div></div></div>';
  h+='<div class="stats"><div class="stat"><span class="sub">Income this month</span><b class="in" data-v="'+inc+'">'+money(inc)+'</b></div><div class="stat"><span class="sub">Spent this month</span><b class="out" data-v="'+exp+'">'+money(exp)+'</b></div></div>';
  var by={};m.filter(function(t){return t.type==='expense'}).forEach(function(t){by[t.cat]=(by[t.cat]||0)+t.amt});
  var keys=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  if(inc>0){var kept=Math.round((inc-exp)/inc*100);h+='<div class="card tip">'+(kept>=0?'You kept <b class="in">'+kept+'%</b> of this month’s income. '+(kept>=20?'Strong month.':'Aim for 20% to build momentum.'):'You’ve spent <b class="out">'+money(exp-inc)+'</b> more than you earned this month.')+'</div>'}
  h+='<div class="card"><h2>Where your money went</h2>';
  if(!keys.length)h+='<div class="empty"><p>No expenses logged this month.</p><button class="btn" onclick="openAdd()">Add an expense</button></div>';
  else keys.forEach(function(k){h+='<div class="cat"><div class="t"><span>'+esc(k)+'</span><b>'+money(by[k])+'</b></div><div class="bar"><i style="width:'+(by[k]/exp*100)+'%"></i></div></div>'});
  h+='</div>';
  if(!S.tx.length&&!S.goals.length)h+='<div class="empty"><button class="btn alt" onclick="sample()">Load sample data</button></div>';else h+='<div class="empty"><button class="btn alt sm" onclick="resetAsk()">Reset all data</button></div>';
  return h}

function act(){
  if(!S.tx.length)return '<div class="card empty"><p>Nothing here yet. Log your first expense or income.</p><button class="btn" onclick="openAdd()">Add entry</button></div>';
  var l=S.tx.slice().sort(function(a,b){return b.date-a.date});
  return '<div class="card"><h2>Activity</h2>'+l.map(function(t){var inc=t.type==='income';return '<div class="row"><div><div>'+esc(t.note||t.cat)+'</div><div class="sub">'+esc(t.cat)+' · '+new Date(t.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</div></div><div style="text-align:right"><b class="'+(inc?'in':'out')+'">'+(inc?'+':'−')+money(t.amt)+'</b><br><button class="link" onclick="delTx(\''+t.id+'\')">Delete</button></div></div>'}).join('')+'</div>'}

function goals(){
  var h='';
  if(!S.goals.length)h='<div class="card empty"><p>Set a goal like “Emergency fund” and watch it fill up.</p></div>';
  S.goals.forEach(function(g){var p=Math.min(g.saved/g.target,1),d=p>=1;
    h+='<div class="card goal'+(d?' done':'')+'"><div class="top"><div><div class="nm">'+esc(g.name)+'</div><div class="sub">'+(d?'Goal reached':money(g.target-g.saved)+' to go')+'</div></div><b>'+Math.round(p*100)+'%</b></div><div class="bar"><i style="width:'+(p*100)+'%"></i></div><div class="meta"><span>'+money(g.saved)+' saved</span><span>'+money(g.target)+'</span></div><button class="btn sm" onclick="openFund(\''+g.id+'\')">Add savings</button> <button class="btn alt sm" onclick="delGoal(\''+g.id+'\')">Remove</button></div>'});
  return h+'<button class="btn" style="width:100%" onclick="openGoal()">New goal</button>'}

function render(){$('view').innerHTML=tab==='home'?home():tab==='act'?act():goals();
  [].forEach.call($('nav').children,function(b){b.classList.toggle('on',b.dataset.t===tab)});var ab=document.querySelector('nav button.on'),pl=$('pill');if(ab&&pl){pl.style.width=ab.offsetWidth+'px';pl.style.transform='translateX('+ab.offsetLeft+'px)'}
  $('fab').style.display=tab==='goals'?'none':'';countUp()}
var anim=true;
function countUp(){var els=document.querySelectorAll('[data-v]');if(!anim||!els.length)return;anim=false;if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;var rc=document.querySelector('.ring circle:last-child');if(rc){var to=rc.getAttribute('stroke-dashoffset');rc.style.transition='none';rc.setAttribute('stroke-dashoffset','351.86');rc.getBoundingClientRect();rc.style.transition='stroke-dashoffset 1.6s .3s cubic-bezier(.2,.8,.2,1)';rc.setAttribute('stroke-dashoffset',to)}
[].forEach.call(els,function(e){var v=+e.dataset.v,t0=performance.now();(function f(t){var p=Math.min((t-t0)/1300,1);e.textContent=money(v*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;var cols=['#00E5FF','#7DF9FF','#ffffff','#3DFFB5','#6AA8FF'];for(var i=0;i<36;i++){var p=document.createElement('i');p.style.cssText='position:fixed;left:50%;top:60%;width:8px;height:12px;border-radius:2px;z-index:20;pointer-events:none;background:'+cols[i%5];document.body.appendChild(p);var a=Math.random()*Math.PI*2,d=120+Math.random()*220;p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d-160)+'px) rotate('+Math.random()*720+'deg)',opacity:1,offset:.5},{transform:'translate('+Math.cos(a)*d*1.2+'px,'+(Math.sin(a)*d+420)+'px) rotate(900deg)',opacity:0}],{duration:1600+Math.random()*800,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=(function(el){return function(){el.remove()}})(p)}}
$('nav').onclick=function(e){if(e.target.dataset.t){tab=e.target.dataset.t;anim=true;render()}};

function open_(html,fn){$('form').innerHTML=html;$('sheet').classList.add('open');$('form').onsubmit=function(e){e.preventDefault();fn(new FormData($('form')));$('sheet').classList.remove('open');save();render()};var f=$('form').querySelector('input');if(f)f.focus()}
$('sheet').onclick=function(e){if(e.target===$('sheet'))$('sheet').classList.remove('open')};
function addForm(){
  return '<div class="seg"><button type="button" data-m="expense" class="'+(mode==='expense'?'on':'')+'">Expense</button><button type="button" data-m="income" class="'+(mode==='income'?'on':'')+'">Income</button></div><label>Amount<input name="amt" type="number" inputmode="decimal" min="0.01" step="0.01" required placeholder="0.00"></label>'+(mode==='expense'?'<label>Category<select name="cat">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></label>':'')+'<label>Note (optional)<input name="note" maxlength="40" placeholder="Lunch, paycheck…"></label><button class="btn">Save entry</button>'}
function openAdd(){
  open_(addForm(),function(f){S.tx.push({id:uid(),type:mode,amt:+f.get('amt'),cat:mode==='income'?'Income':f.get('cat'),note:(f.get('note')||'').trim(),date:Date.now()});toast('Entry saved')});
  $('form').onclick=function(e){var m=e.target.dataset&&e.target.dataset.m;if(m){mode=m;var v=$('form').querySelector('[name=amt]').value;$('form').innerHTML=addForm();$('form').querySelector('[name=amt]').value=v}}}
function openGoal(){open_('<label>Goal name<input name="name" maxlength="30" required placeholder="Emergency fund"></label><label>Target amount<input name="target" type="number" inputmode="decimal" min="1" step="0.01" required></label><label>Already saved (optional)<input name="saved" type="number" inputmode="decimal" min="0" step="0.01"></label><button class="btn">Create goal</button>',function(f){S.goals.push({id:uid(),name:f.get('name').trim(),target:+f.get('target'),saved:+(f.get('saved')||0)});toast('Goal created')})}
function openFund(id){var g=S.goals.filter(function(x){return x.id===id})[0];open_('<div class="sub">'+esc(g.name)+'</div><label>Amount to add<input name="amt" type="number" inputmode="decimal" min="0.01" step="0.01" required></label><button class="btn">Add savings</button>',function(f){var was=g.saved>=g.target;g.saved+=+f.get('amt');var now=g.saved>=g.target;toast(now?'Goal reached!':'Savings added');if(now&&!was)confetti()})}
function delTx(id){S.tx=S.tx.filter(function(t){return t.id!==id});save();render()}
function delGoal(id){var g=S.goals.filter(function(x){return x.id===id})[0];if(!g)return;open_('<div>Remove “'+esc(g.name)+'”? This can’t be undone.</div><button class="btn" style="background:var(--red)">Remove goal</button><button type="button" class="btn alt" onclick="$(\'sheet\').classList.remove(\'open\')">Keep goal</button>',function(){S.goals=S.goals.filter(function(x){return x.id!==id});toast('Goal removed')})}
function sample(){var n=Date.now();S.goals=[{id:uid(),name:'Emergency fund',target:2000,saved:850},{id:uid(),name:'Weekend trip',target:600,saved:540}];
  S.tx=[['income','Income','Paycheck',2400],['expense','Bills','Rent share',700],['expense','Food','Groceries',180],['expense','Transport','Transit pass',65],['expense','Fun','Concert',90]].map(function(r,i){return{id:uid(),type:r[0],cat:r[1],note:r[2],amt:r[3],date:n-i*36e5}});save();render();toast('Sample data loaded. Tap Reset to clear it')}
$('fab').onclick=openAdd;
function closeSheet(){$('sheet').classList.remove('open')}
function resetAsk(){open_('<div>Clear all entries and goals? This can’t be undone.</div><button class="btn" style="background:var(--red)">Clear everything</button><button type="button" class="btn alt" onclick="closeSheet()">Keep my data</button>',function(){S={tx:[],goals:[]};tab='home';anim=true;toast('Data cleared')})}
$('reset').onclick=resetAsk;
document.addEventListener('pointerdown',function(e){var b=e.target.closest&&e.target.closest('.btn:not(.fab)');if(!b)return;var r=b.getBoundingClientRect(),s=document.createElement('i');s.className='rip';s.style.left=(e.clientX-r.left)+'px';s.style.top=(e.clientY-r.top)+'px';b.appendChild(s);setTimeout(function(){s.remove()},650)});
var tiltEl=null;
function untilt(){if(tiltEl){tiltEl.style.transform='';tiltEl=null}}
function tilt(e){var h=e.target.closest&&e.target.closest('.hero');if(!h){untilt();return}var r=h.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;h.style.transform='perspective(700px) rotateX('+(-y*10)+'deg) rotateY('+(x*12)+'deg) scale(1.02)';tiltEl=h}
document.addEventListener('pointermove',tilt);document.addEventListener('pointerdown',tilt);document.addEventListener('pointerup',untilt);document.addEventListener('pointercancel',untilt);
window.addEventListener('resize',function(){var a=document.querySelector('nav button.on'),p=$('pill');if(a&&p){p.style.width=a.offsetWidth+'px';p.style.transform='translateX('+a.offsetLeft+'px)'}});
'Pocket Goal'.split('').forEach(function(ch,i){var s=document.createElement('span');s.style.setProperty('--i',i);s.setAttribute('aria-hidden','true');s.textContent=ch===' '?'\u00a0':ch;$('word').appendChild(s)});
function enterApp(){var sp=$('splash');if(!sp||sp.classList.contains('leave'))return;sp.classList.add('leave');confetti();setTimeout(function(){sp.remove();anim=true;render()},780)}
$('splash').onclick=enterApp;
try{var cv=document.createElement('canvas');cv.width=cv.height=180;var cx=cv.getContext('2d'),bg=cx.createLinearGradient(0,0,180,180);bg.addColorStop(0,'#0F4F3E');bg.addColorStop(1,'#06231C');cx.fillStyle=bg;cx.fillRect(0,0,180,180);var cg=cx.createRadialGradient(72,72,6,90,90,62);cg.addColorStop(0,'#FFF1B0');cg.addColorStop(.5,'#F2C14E');cg.addColorStop(1,'#B97A0C');cx.fillStyle=cg;cx.beginPath();cx.arc(90,90,62,0,7);cx.fill();cx.fillStyle='#6B4300';cx.font='84px Georgia,serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('$',90,96);var iu=cv.toDataURL('image/png');['apple-touch-icon','icon'].forEach(function(r){var l=document.createElement('link');l.rel=r;l.href=iu;document.head.appendChild(l)});var ml=document.createElement('link');ml.rel='manifest';ml.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify({name:'Pocket Goal',short_name:'Pocket Goal',display:'standalone',background_color:'#06231C',theme_color:'#06231C',icons:[{src:iu,sizes:'180x180',type:'image/png'}]}));document.head.appendChild(ml)}catch(e){}
var msgs=['Initializing financial core','Syncing goal matrix','Calibrating systems','Online'],ls=performance.now()+1900;
(function tick(now){if(!$('splash'))return;var p=Math.max(0,Math.min((now-ls)/2600,1)),e=p*p*(3-2*p);$('lf').style.transform='scaleX('+e+')';$('lpc').textContent=Math.round(e*100)+'%';$('lmsg').textContent=msgs[p>=1?3:Math.min(2,Math.floor(p*3))];if(p<1)requestAnimationFrame(tick);else setTimeout(enterApp,450)})(performance.now());
$('theme').onclick=function(){var r=document.documentElement,d=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',d?'light':'dark')};
render();
</script>
